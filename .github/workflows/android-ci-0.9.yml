name: Android CI 0.9.0

on:
  push:
    branches:
      - feature/0.9.0-sgpu-utilization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wuwa-accelerator-0.9.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint and APK builds
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: bash ./gradlew --no-daemon :app:lintDebug --stacktrace

      - name: Build debug and release APKs
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WuWaAccelerator-0.9.0-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
