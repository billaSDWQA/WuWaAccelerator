name: Copilot Cross-Review Bridge

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: copilot-cross-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/copilot-review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Resolve pull request revision
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const expectedRepo = `\${context.repo.owner}/\${context.repo.repo}`;
            if (!pr.head.repo || pr.head.repo.full_name !== expectedRepo) {
              core.setFailed("Cross-repository/fork PRs are not accepted by this read-only bridge.");
              return;
            }
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("head_ref", pr.head.ref);
            core.setOutput("head_repo", pr.head.repo.full_name);

      # Keep trusted bridge code at the workflow's default-branch revision.
      - name: Checkout trusted bridge code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      # The PR checkout is data only. No scripts, actions, package hooks, or builds
      # from the PR checkout are executed by this workflow.
      - name: Checkout pull request source as read-only data
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.pr.outputs.head_sha }}
          path: target
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Copilot SDK
        run: npm install --prefix tools/copilot-review --no-audit --no-fund

      - name: Run bridge helper tests
        run: npm test --prefix tools/copilot-review

      - name: Prepare bounded discussion context
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const recent = comments.slice(-12).map((comment) => ({
              author: comment.user?.login ?? "unknown",
              createdAt: comment.created_at,
              body: String(comment.body ?? "").slice(0, 5000),
            }));
            const payload = {
              repository: `\${context.repo.owner}/\${context.repo.repo}`,
              pullRequest: {
                number: pr.number,
                title: pr.title,
                base: pr.base.ref,
                head: pr.head.ref,
                headSha: pr.head.sha,
              },
              triggerComment: String(context.payload.comment.body ?? "").slice(0, 5000),
              comments: recent,
            };
            fs.writeFileSync("debate-context.json", JSON.stringify(payload, null, 2), { mode: 0o600 });

      - name: Ask Copilot to review the checked-out source
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          TARGET_DIR: ${{ github.workspace }}/target
          CONTEXT_PATH: ${{ github.workspace }}/debate-context.json
          RESPONSE_PATH: ${{ github.workspace }}/copilot-response.md
        run: node tools/copilot-review/run.mjs

      - name: Publish Copilot response to the PR discussion
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const response = fs.readFileSync("copilot-response.md", "utf8");
            const body = [
              "## GitHub Copilot — Cross-review",
              "",
              response,
              "",
              "---",
              "_Generated by the read-only Copilot SDK bridge. No repository files were modified._",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Report bridge failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "## Copilot cross-review bridge failed",
                "",
                "No review response was published. Check the [workflow run](" +
                  `https://github.com/\${context.repo.owner}/\${context.repo.repo}/actions/runs/\${context.runId}` +
                  ") for the failing step. The Copilot token is never printed in logs.",
              ].join("\n"),
            });
