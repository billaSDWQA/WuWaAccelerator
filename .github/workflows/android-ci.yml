name: Android CI 1.0.x

on:
  # Feature branches are built by pull_request to avoid duplicate push + PR runs.
  push:
    branches:
      - main
      - feature/1.0.0-full-accelerator
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: bash ./gradlew --no-daemon :app:lintDebug --stacktrace

      - name: Build debug and release APKs
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WuWaSmoothAccelerator-1.0.2-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
